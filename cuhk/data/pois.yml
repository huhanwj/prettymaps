# CUHK 迎新地圖 POI 表
# 定位三通道（按優先級）：official_name（與官方點位 buildings/landmarks/colleges/
# shuttle_stops 合集模糊匹配）→ lon/lat 直接給坐標 → osm_name（與 OSM 要素模糊匹配）。
# 三者至少其一；official_name 須與官方數據集 cuhk_location_db.js 的名稱一致。
# category: study 學習 / life 生活 / sports 體育 / transport 交通 / landmark 地標
pois:
