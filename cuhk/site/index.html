<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>香港中文大學校園地圖 · CUHK Campus Map</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK", sans-serif; }
  #map { position: absolute; inset: 0; }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; row-gap: 6px;
    padding: 10px 16px; background: rgba(255, 255, 255, 0.94);
    border-bottom: 2px solid #A5BFD2;
  }
  .maplibregl-ctrl-top-right { top: 56px; }
  .title { font-size: 18px; font-weight: 700; color: #2F3737; }
  .title .sub { font-size: 12px; font-weight: 400; color: #475657; margin-left: 10px; }
  #chips { display: flex; gap: 8px; align-items: center; }
  .chip {
    font: inherit;
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 4px 12px; border: 1.5px solid #2F3737; border-radius: 999px;
    background: #fff; font-size: 13px; color: #2F3737; user-select: none;
  }
  .chip .swatch { width: 10px; height: 10px; border-radius: 50%; }
  .chip.off { opacity: 0.35; }
  .bus-filter {
    display: flex; align-items: center; gap: 6px; font-size: 13px; color: #2F3737;
  }
  #busRouteSelect {
    max-width: 260px; padding: 4px 28px 4px 10px; border: 1.5px solid #2F3737;
    border-radius: 999px; background: #fff; color: #2F3737; font: inherit; cursor: pointer;
  }
  #busRouteSelect:disabled { cursor: wait; opacity: 0.55; }
  #btnTerrain {
    cursor: pointer; padding: 4px 12px; border: 1.5px solid #2F3737;
    border-radius: 999px; background: #fff; color: #2F3737; font-size: 13px;
  }
  #btnTerrain.active { background: #D8CCBA; }
  #btnTerrain:disabled { cursor: wait; opacity: 0.45; }

  .poi-marker { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .poi-marker .dot {
    width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,0.6); flex: none;
  }
  .poi-marker .lbl {
    display: none; line-height: 1.15; pointer-events: none;
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
  }
  .poi-marker .zh { font-size: 12px; font-weight: 700; color: #2F3737; text-shadow: 0 0 3px #fff, 0 0 3px #fff; white-space: nowrap; }
  .poi-marker .en { font-size: 10px; color: #475657; text-shadow: 0 0 3px #fff, 0 0 3px #fff; white-space: nowrap; }
  body.z-mid .poi-marker.cat-landmark .lbl,
  body.z-mid .poi-marker.cat-transport .lbl { display: block; }
  body.z-high .poi-marker .lbl { display: block; }
  .poi-marker.hidden { display: none; }
  .poi-university-station-west .lbl { left: auto; right: 15px; text-align: right; }

  .cat-study .dot, .chip[data-cat="study"] .swatch { background: #2F3737; }
  .cat-life .dot, .chip[data-cat="life"] .swatch { background: #FF5E5B; }
  .cat-sports .dot, .chip[data-cat="sports"] .swatch { background: #64B96A; }
  .cat-transport .dot, .chip[data-cat="transport"] .swatch { background: #2f6fb5; }
  .cat-landmark .dot, .chip[data-cat="landmark"] .swatch { background: #E8B64C; }

  .maplibregl-popup-content { border: 2px solid #2F3737; border-radius: 6px; }
  .pop .zh { font-size: 15px; font-weight: 700; color: #2F3737; }
  .pop .en { font-size: 12px; color: #475657; margin-bottom: 6px; }
  .pop p { margin: 6px 0 0; font-size: 12.5px; color: #2F3737; }

  #credit {
    position: absolute; bottom: 8px; left: 8px; z-index: 10;
    font-size: 11px; color: #475657; background: rgba(255,255,255,0.9);
    padding: 2px 8px; border-radius: 4px;
  }
  #link-legend {
    position: absolute; right: 10px; bottom: 30px; z-index: 10;
    display: grid; gap: 5px; padding: 8px 10px; border-radius: 8px;
    background: rgba(255,255,255,0.94); color: #475657; font-size: 11px;
    box-shadow: 0 2px 10px rgba(47,55,55,0.14);
  }
  .legend-line { display: inline-block; width: 32px; margin-right: 7px; vertical-align: middle; border-top: 3px solid #5C95B7; }
  .legend-line.stairs { border-top-style: dashed; }
  .legend-line.path { border-top-width: 2px; border-top-color: #9AAFC0; }
  #terrain-legend {
    position: absolute; right: 10px; bottom: 116px; z-index: 10;
    min-width: 132px; padding: 8px 10px; border-radius: 8px;
    background: rgba(255,255,255,0.96); color: #475657; font-size: 11px;
    box-shadow: 0 2px 10px rgba(47,55,55,0.14);
  }
  #terrain-legend.hidden { display: none; }
  .terrain-title { margin-bottom: 5px; font-weight: 700; color: #2F3737; }
  .terrain-band { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
  .terrain-swatch { width: 28px; height: 10px; border: 1px solid rgba(47,55,55,0.15); }
  #error-overlay {
    position: absolute; inset: 0; z-index: 100; display: flex;
    align-items: center; justify-content: center; background: #FFFFFF;
    font-size: 16px; color: #2F3737; text-align: center; line-height: 2;
  }
  #error-overlay.hidden { display: none; }
  #error-overlay code { background: #fff; padding: 2px 8px; border: 1px solid #2F3737; }
</style>
</head>
<body>
<div id="map"></div>
<div id="topbar">
  <div class="title">香港中文大學校園地圖<span class="sub">CUHK Campus Map · V3</span></div>
  <div id="chips">
    <button type="button" class="chip" data-cat="study" aria-pressed="true"><span class="swatch"></span>學習</button>
    <button type="button" class="chip" data-cat="life" aria-pressed="true"><span class="swatch"></span>生活</button>
    <button type="button" class="chip" data-cat="sports" aria-pressed="true"><span class="swatch"></span>體育</button>
    <button type="button" class="chip" data-cat="transport" aria-pressed="true"><span class="swatch"></span>交通</button>
    <button type="button" class="chip" data-cat="landmark" aria-pressed="true"><span class="swatch"></span>地標</button>
    <button type="button" id="btnTerrain" aria-pressed="false" disabled>地形</button>
    <label class="bus-filter" for="busRouteSelect">校巴
      <select id="busRouteSelect" disabled>
        <option value="off">關閉</option>
        <option value="all">全部線路</option>
      </select>
    </label>
  </div>
</div>
<div id="terrain-legend" class="hidden" aria-label="高程圖例">
  <div class="terrain-title">高程 Elevation</div>
  <div class="terrain-band"><span class="terrain-swatch" style="background:#F7F4ED"></span>0–49 m</div>
  <div class="terrain-band"><span class="terrain-swatch" style="background:#ECE6DA"></span>50–99 m</div>
  <div class="terrain-band"><span class="terrain-swatch" style="background:#DED6C9"></span>100–149 m</div>
  <div class="terrain-band"><span class="terrain-swatch" style="background:#CDC3B5"></span>150 m+</div>
</div>
<div id="link-legend" aria-label="步行連接圖例">
  <div><span class="legend-line path"></span>普通步道</div>
  <div><span class="legend-line"></span>天橋</div>
  <div><span class="legend-line stairs"></span>樓梯 / 高差</div>
</div>
<div id="credit">數據 © OpenStreetMap contributors · 校園建築/校巴 © CUHK 官方校園地圖 · 風格靈感來自 prettymaps</div>
<div id="error-overlay" class="hidden">
  <div>
    找不到地圖數據文件 😢<br>
    請先在倉庫根目錄運行：<code>python cuhk/scripts/build_data.py</code><br>
    然後用 <code>start.bat</code> 重新打開本頁
  </div>
</div>
<script src="vendor/maplibre-gl.js"></script>
<script src="app-core.js"></script>
<script src="app.js"></script>
</body>
</html>
